# trime.custom.yaml
patch:
  # 新建一個按鍵佈局 wubi86_double_key
  "preset_keyboards/wubi86_double_key": # 佈局 ID
    author: "boboIqiqi" # 作者
    name: "五笔双键" # 方便自己辨識的名字
    ascii_mode: 0 # 默認進入中文狀態
    height: 60 # 每行高度
    width: 20 # 按鍵默認寬度（取所有按鍵中用得較多的寬度值，接下來就可以少寫一些 width了）
    lock: true # 切換程序時記憶鍵盤
    keys: # 按鍵排列
      # 第一行
      - { label: "Q W", click: q, long_click: 1 }
      - { label: "E R", click: e, long_click: 2 }
      - { label: "T Y", click: t, long_click: 3 }
      - { label: "U I", click: u, long_click: 4 }
      - { label: "O P", click: o, long_click: 5 }

      # 第二行
      - { label: "A S", click: a, long_click: 6 }
      - { label: "D F", click: d, long_click: 7 }
      - { label: "G H", click: g, long_click: 8 }
      - { label: "J K", click: j, long_click: 9 }
      - { label: "L", click: l, long_click: 0 }

      # 第三行
      - { click: Keyboard_qwerty_cn, width: 10 }
      - { label: "Z", click: z, long_click: "@", width: 10 }
      - { label: "X C", click: x, long_click: "!" }
      - { label: "V B", click: v, long_click: "?" }
      - { label: "N M", click: n, long_click: "." }
      - { click: BackSpace }

      # 第四行
      - { click: Keyboard_qwerty, width: 15 }
      - { click: Keyboard_symbols, width: 10 }
      - { label: "，", click: comma, width: 10 }
      - { label: "五笔 86 双键版", click: space, width: 30 }
      - { label: "。", click: period, width: 10 }
      - { label: "123", click: Keyboard_number, width: 10 }
      - { label: "确定", click: Return, width: 15 }

  # 26 键布局默认进入英文状态
  "preset_keyboards/qwerty/ascii_mode": 1

  # 26 键中文（用于拼音反查）
  "preset_keyboards/qwerty_cn":
    name: "26 键中文"
    __include: trime.yaml:preset_keyboards/qwerty
    ascii_mode: 0

  # 按键功能定义
  "preset_keys/Keyboard_qwerty": # 切换至英文
    label: 英
    select: qwerty
    send: Eisu_toggle

  "preset_keys/Keyboard_qwerty_cn": # 切换至 26 键中文
    label: 全
    select: qwerty_cn
    send: Eisu_toggle

  "preset_keys/Mode_switch": # 切换回中文
    label: 五笔
    select: wubi86_double_key
    send: Eisu_toggle

  "preset_keys/Keyboard_editor": # 切换至编辑器
    label: 编辑
    select: editor
    send: Eisu_toggle

  "preset_keys/Mode_switch_2": # 中英文切换
    states: [ 中, En ]
    toggle: ascii_mode
    send: Mode_switch

  tool_bar:
    button_spacing: 5 # 按钮间距

    hide_button: &hide_button
      foreground:
        style: "ic@keyboard_close"
        normal: candidate_text_color
      action: Hide

    emoji_button: &emoji_button
      foreground:
        style: "ic@emoticon"
      action: liquid_keyboard_emoji

    clipboard_button: &clipboard_button
      foreground:
        style: "ic@clipboard"
      action: clipboard_window

    edit_button: &edit_button
      foreground:
        style: "ic@cursor_text"
      action: Keyboard_editor

    ascii_mode_button: &ascii_mode_button
      foreground:
        option_styles: ["中", "En"]
      action: Mode_switch_2

    full_shape_button: &full_shape_button
      foreground:
        # option_styles: ["ic@moon_new", "ic@moon_full"]
        option_styles: ["半", "全"]
      action: Zenkaku_Hankaku

    # 右侧按钮列表（从右向左排列）
    buttons: [ *hide_button, *emoji_button, *clipboard_button, *edit_button, *ascii_mode_button, *full_shape_button ]
